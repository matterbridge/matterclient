name: Development
on: [push, pull_request]
jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Fetch full history so the linter can accurately diff the PR base
          fetch-depth: 0

      # Run on Pull Requests (diffs against the target branch)
      - name: Run golangci-lint (PR)
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.1
          args: "--new-from-rev=origin/${{ github.base_ref }}"

      # Run on Pushes (standard run)
      - name: Run golangci-lint (Push)
        if: github.event_name == 'push'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.1
          only-new-issues: true
